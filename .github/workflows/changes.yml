name: Validate Changes

permissions:
  contents: read

on:
  pull_request:
    branches: [next, main]

concurrency:
  group: changes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes_and_migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve current base branch tip
        id: base
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.ref }}
          echo "sha=$(git rev-parse FETCH_HEAD)" >> $GITHUB_OUTPUT

      - name: Check for migration file changes
        id: migration_check
        run: |
          MIGRATION_FILES=$(git diff --name-only ${{ steps.base.outputs.sha }} ${{ github.sha }} | grep -E '^migrations/.*\.sql$' || true)
          if [ -n "$MIGRATION_FILES" ]; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed:"
            echo "$MIGRATION_FILES"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No migration files changed"
          fi

      - name: Validate migration filenames
        if: steps.migration_check.outputs.has_migrations == 'true'
        run: ./.github/scripts/validate-migration-filenames.sh

      - name: EntityField Sequence must not be a literal placeholder
        run: |
          node ./.github/scripts/check-migration-entityfield-sequence.mjs --self-test
          node ./.github/scripts/check-migration-entityfield-sequence.mjs ${{ steps.base.outputs.sha }} ${{ github.sha }}

      - name: Versioned migrations must not contain spDeleteUnneededEntityFields
        run: |
          node ./.github/scripts/check-migration-no-prune.mjs --self-test
          node ./.github/scripts/check-migration-no-prune.mjs ${{ steps.base.outputs.sha }} ${{ github.sha }}

      - name: Validate migration timestamps are newer than existing
        if: steps.migration_check.outputs.has_migrations == 'true'
        run: |
          # Get max timestamp from existing migrations on base branch
          MAX_EXISTING=$(git show ${{ steps.base.outputs.sha }}:migrations/ 2>/dev/null | \
            grep -oE 'V[0-9]{12}' | sed 's/^V//' | sort -n | tail -1 || echo "0")

          # Check only newly added migration files (not modified existing ones, not renames)
          NEW_FILES=$(git diff --diff-filter=A --name-only ${{ steps.base.outputs.sha }} ${{ github.sha }} -- migrations/ | grep -E '\.sql$' || true)
          for file in $NEW_FILES; do
            basename=$(basename "$file")
            timestamp=$(echo "$basename" | grep -oE '^V[0-9]{12}' | sed 's/^V//' || true)
            if [ -n "$timestamp" ] && [ "$timestamp" -le "$MAX_EXISTING" ]; then
              echo "::error::Migration $basename has timestamp ($timestamp) <= max existing ($MAX_EXISTING)"
              exit 1
            fi
          done
          echo "All new migration timestamps are valid"

      # publish.yml refuses to publish while any changeset remains, but only after the merge. The
      # release PR arrives with its changesets consumed by `pnpm run version`, and a hotfix into main
      # must carry its own bump, so a PR into main that still has one is caught here, before merging.
      # The find expression is publish.yml's, so the two agree on what counts as a changeset.
      # scripts/main-pr-changesets.spec.mjs runs this step.
      - name: No pending changesets on a pull request into main
        if: github.base_ref == 'main'
        run: |
          PENDING=$(find .changeset -name "*.md" -not -name "README.md" 2>/dev/null | sort)
          if [ -n "$PENDING" ]; then
            echo "$PENDING"
            echo "::error::This pull request into main still carries pending changesets, so the version was never bumped and publish.yml would refuse to publish after the merge. Cut the release with Prepare a release (docs/release.md), or run 'pnpm run version' on a hotfix branch."
            exit 1
          fi
          echo "No pending changesets."

      # A PR into main must contain main's tip, or merging it reverts whatever main has that the
      # branch lacks — including a release's published version bump. GitHub will not stop that
      # merge (main has no ruleset), and the PR's diff shows it only as a quiet version downgrade.
      # This is how a `next -> main` PR opened while v5.50.0's back-merge was outstanding would have
      # set main back from 5.50.0 to 5.49.0. A release branch cut by Prepare a release, and a hotfix
      # branched from main, both contain main and pass.
      #
      # HEAD_SHA is the PR's head, not github.sha: on a pull_request event github.sha is the merge
      # preview commit, which contains the base by construction and would always pass. Both
      # branches are fetched in full here; the base fetch above is depth 1, and ancestry needs history.
      # scripts/backmerge-guards.spec.mjs runs this step and the next one.
      - name: A pull request into main must contain main
        if: github.base_ref == 'main'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse FETCH_HEAD)
          set +e
          git merge-base --is-ancestor "$MAIN_SHA" "$HEAD_SHA"
          RC=$?
          set -e
          case "$RC" in
            0) echo "This branch contains main's tip (${MAIN_SHA:0:10})." ;;
            1)
              echo "main has commits this branch lacks:"
              git log --oneline "$HEAD_SHA..$MAIN_SHA" | head -20
              echo "::error::This branch does not contain main's tip (${MAIN_SHA:0:10}), so merging it would revert those commits on main — a released version bump among them. If this is a release, cut it with Prepare a release (docs/release.md) after merging the outstanding chore/backmerge-* PR into next. If it is a hotfix, branch it from main."
              exit 1
              ;;
            *) echo "::error::git merge-base --is-ancestor exited $RC — cannot tell whether this branch contains main."; exit 1 ;;
          esac

      # A PR into next while a back-merge is outstanding: not harmful to merge in itself, but it is
      # the moment someone is working against a `next` that is behind main, and the step that would
      # otherwise notice (release-prep.mjs) runs only when a release is cut. Failing here names the
      # problem while it is still a five-minute fix. publish.yml merges the back-merge automatically
      # once its checks pass, so this is red only briefly after a release, or when that merge was
      # left open for a human (conflicts, a red check) — the publish run's summary says which.
      # The back-merge PR itself contains main and passes.
      - name: No back-merge outstanding on a pull request into next
        if: github.base_ref == 'next'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN_SHA=$(git rev-parse FETCH_HEAD)
          git fetch --no-tags origin next
          NEXT_SHA=$(git rev-parse FETCH_HEAD)
          ancestor() {
            set +e
            git merge-base --is-ancestor "$1" "$2"
            local rc=$?
            set -e
            case "$rc" in
              0|1) return "$rc" ;;
              *) echo "::error::git merge-base --is-ancestor exited $rc — cannot tell whether a back-merge is outstanding."; exit 1 ;;
            esac
          }
          if ancestor "$MAIN_SHA" "$NEXT_SHA"; then
            echo "main (${MAIN_SHA:0:10}) is already in next — no back-merge outstanding."
          elif ancestor "$MAIN_SHA" "$HEAD_SHA"; then
            echo "This pull request carries main (${MAIN_SHA:0:10}) into next."
          else
            echo "main has commits next lacks:"
            git log --oneline "$NEXT_SHA..$MAIN_SHA" | head -20
            echo "::error::A back-merge is outstanding: main (${MAIN_SHA:0:10}) is not in next. Merge the open chore/backmerge-* pull request into next first (publish.yml merges it automatically once its checks pass; if it was left open, the publish run's summary says why), then re-run this check."
            exit 1
          fi

      - name: Check for changeset (PRs to next with migrations)
        if: |
          steps.migration_check.outputs.has_migrations == 'true' &&
          github.base_ref == 'next'
        run: |
          CHANGESET_FILES=$(git diff --name-only ${{ steps.base.outputs.sha }} ${{ github.sha }} | grep -E '^\.changeset/.*\.md$' | grep -v 'README.md' || true)
          if [ -z "$CHANGESET_FILES" ]; then
            echo "::error::Migrations were added but no changeset found. Run 'pnpm exec changeset' to create one with at least a 'minor' bump."
            exit 1
          fi

          # Check that at least one changeset has 'minor' or 'major' bump
          HAS_SUFFICIENT_BUMP=false
          for f in $CHANGESET_FILES; do
            if grep -qE "minor|major" "$f"; then
              HAS_SUFFICIENT_BUMP=true
              break
            fi
          done

          if [ "$HAS_SUFFICIENT_BUMP" = false ]; then
            echo "::error::Migrations require at least a 'minor' version bump in the changeset."
            exit 1
          fi
          echo "Valid changeset with minor or major bump found"

  parse_migrations:
    name: Parse migrations (T-SQL syntax check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'yourStrong(!)Password123'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'yourStrong(!)Password123' -C -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install sqlcmd (if available)
        run: |
          if ! command -v sqlcmd &> /dev/null && [ ! -x /opt/mssql-tools18/bin/sqlcmd ] && [ ! -x /opt/mssql-tools/bin/sqlcmd ]; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg 2>/dev/null || true
            curl -fsSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list 2>/dev/null || true
            sudo apt-get update -qq 2>/dev/null || true
            sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 unixodbc-dev 2>/dev/null || true
            if [ -d "/opt/mssql-tools18/bin" ]; then
              echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH
            fi
          fi

      - name: Parse migrations with SQL Server
        env:
          DB_HOST: localhost
          DB_PORT: 1433
          DB_USERNAME: sa
          DB_PASSWORD: 'yourStrong(!)Password123'
        run: |
          node .github/scripts/parse-migrations.mjs --self-test
          node .github/scripts/parse-migrations.mjs
