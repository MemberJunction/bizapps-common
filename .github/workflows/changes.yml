# The checks a migration must pass to enter `next`.
#
# Scoped by TRIGGER, not by a job-level `if:`. Required status checks are configured per
# branch, and these are required on `next` only, so the workflow simply does not run on PRs
# into `main`. That is safe precisely because nothing requires these contexts there — a
# workflow filtered out at the `on:` level creates NO check run, which would leave a required
# context Pending forever. Scope and requirement have to agree; here they do.
#
# The release-side assertions (nothing pending, bump level, immutability) live in
# release-readiness.yml, which is scoped to `main` for the same reason.
name: Validate Changes

permissions:
  contents: read

on:
  pull_request:
    # `ready_for_review` is NOT in the default type set (opened/synchronize/reopened), and the
    # jobs below skip while the PR is a draft — without it, marking a PR ready would not
    # re-trigger anything and the checks would never report.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [next]

concurrency:
  group: changes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Is the migration well-formed, and will Flyway actually run it in the right order?
  migration-naming:
    name: 'migration naming'
    # Drafts DO fire opened/synchronize, so without this a draft burns a run on every push.
    # A job skipped by `if:` still reports a conclusion, so this stays safe as a required check.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Two refs, and they are not interchangeable:
      #
      #   sha — the MERGE BASE, for "what did THIS PR change". A two-dot diff against the base
      #         tip reports every migration merged to `next` since this branch was cut as though
      #         this PR had touched it (as a removal, which `--name-only` cannot distinguish from
      #         an addition). That is a false failure on any branch that is behind.
      #   tip — the base branch TIP, for the timestamp watermark only. A migration merged while
      #         this PR was open still has to be ordered behind ours, so the watermark is
      #         deliberately the strictest available.
      #
      # No `--depth=1` on the fetch: merge-base needs history on both sides.
      - name: Resolve the merge base
        id: mb
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          echo "tip=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git merge-base FETCH_HEAD HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check for migration file changes
        id: migration_check
        run: |
          MIGRATION_FILES=$(git diff --name-only ${{ steps.mb.outputs.sha }} HEAD | grep -E '^migrations/.*\.sql$' || true)
          if [ -n "$MIGRATION_FILES" ]; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Migration files changed:"
            echo "$MIGRATION_FILES"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No migration files changed"
          fi

      - name: Validate migration filenames
        if: steps.migration_check.outputs.has_migrations == 'true'
        run: ./.github/scripts/validate-migration-filenames.sh

      # `--self-test` first, deliberately: the plain invocation exits 0 with "no changed
      # migrations to check" when there is nothing to do, so the self-test is what makes a
      # green run mean something. Keep the two lines together.
      - name: EntityField Sequence must not be a literal placeholder
        run: |
          node ./.github/scripts/check-migration-entityfield-sequence.mjs --self-test
          node ./.github/scripts/check-migration-entityfield-sequence.mjs ${{ steps.mb.outputs.sha }} HEAD

      - name: Versioned migrations must not contain spDeleteUnneededEntityFields
        run: |
          node ./.github/scripts/check-migration-no-prune.mjs --self-test
          node ./.github/scripts/check-migration-no-prune.mjs ${{ steps.mb.outputs.sha }} HEAD

      - name: Validate migration timestamps are newer than existing
        if: steps.migration_check.outputs.has_migrations == 'true'
        run: |
          # Watermark is the base TIP, not the merge base — see the note on the step above.
          MAX_EXISTING=$(git show ${{ steps.mb.outputs.tip }}:migrations/ 2>/dev/null | \
            grep -oE 'V[0-9]{12}' | sed 's/^V//' | sort -n | tail -1 || echo "0")

          # Only newly ADDED files (not modified, not renamed).
          NEW_FILES=$(git diff --diff-filter=A --name-only ${{ steps.mb.outputs.sha }} HEAD -- migrations/ | grep -E '\.sql$' || true)
          for file in $NEW_FILES; do
            basename=$(basename "$file")
            timestamp=$(echo "$basename" | grep -oE '^V[0-9]{12}' | sed 's/^V//' || true)
            if [ -n "$timestamp" ] && [ "$timestamp" -le "$MAX_EXISTING" ]; then
              echo "::error::Migration $basename has timestamp ($timestamp) <= max existing ($MAX_EXISTING)"
              exit 1
            fi
          done
          echo "All new migration timestamps are valid"

  # A PR that adds a migration must carry a minor-or-major changeset.
  #
  # Deliberately STRICTER than ci/check-bump-level.sh, which judges the aggregate release: one
  # minor anywhere in the release window already makes the release a minor, so by that rule a
  # follow-up migration arriving with a patch changeset is not an error. Requiring it per PR
  # trades that precision for catching the problem at the door, where the author still has the
  # context — rather than one stage downstream on a machine-generated version PR that names
  # nobody. Both are wired up on purpose: this is the first net, rr: minor bump is the second.
  #
  # The cost is the case it over-fires on: a comment fix inside a migration, or a second
  # migration in a window a minor already covers. That is what `bump-level-exempt` is for —
  # the same label the release-side check honours, so there is one escape hatch to learn.
  migration-changeset:
    name: 'migration changeset'
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the merge base
        id: mb
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          echo "sha=$(git merge-base FETCH_HEAD HEAD)" >> "$GITHUB_OUTPUT"

      - name: Migrations require a minor or major changeset
        env:
          EXEMPT: ${{ contains(github.event.pull_request.labels.*.name, 'bump-level-exempt') }}
        run: |
          MIGRATION_FILES=$(git diff --name-only ${{ steps.mb.outputs.sha }} HEAD | grep -E '^migrations/.*\.sql$' || true)
          if [ -z "$MIGRATION_FILES" ]; then
            echo "No migration changes — any bump level is fine"
            exit 0
          fi

          if [ "$EXEMPT" = "true" ]; then
            echo "::warning::Exempt via the bump-level-exempt label. Migrations changed:"
            echo "$MIGRATION_FILES" | sed 's/^/  /'
            exit 0
          fi

          CHANGESET_FILES=$(git diff --name-only ${{ steps.mb.outputs.sha }} HEAD | grep -E '^\.changeset/.*\.md$' | grep -v 'README.md' || true)
          if [ -z "$CHANGESET_FILES" ]; then
            echo "::error::This PR adds migrations but no changeset. A schema change is a feature: run 'pnpm exec changeset' and pick minor. If the migration genuinely is not a feature — a re-captured baseline, a comment fix — label the PR 'bump-level-exempt'. Migrations changed:"
            echo "$MIGRATION_FILES" | sed 's/^/  /'
            exit 1
          fi

          for f in $CHANGESET_FILES; do
            if grep -qE "^'[^']+': (minor|major)$" "$f"; then
              echo "Found a minor/major changeset: $f"
              exit 0
            fi
          done

          echo "::error::This PR adds migrations, and its changeset(s) only request a patch. A consumer upgrading on a patch would not expect the schema to change — raise one to minor. If the migration genuinely is not a feature, label the PR 'bump-level-exempt'. Changesets in this PR:"
          echo "$CHANGESET_FILES" | sed 's/^/  /'
          exit 1

  # Does the T-SQL actually parse? Stands up a real SQL Server rather than pattern-matching,
  # which is why it is the most expensive job here — and why the draft guard matters most on it.
  parse-migrations:
    name: 'Parse migrations (T-SQL syntax check)'
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'yourStrong(!)Password123'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'yourStrong(!)Password123' -C -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install sqlcmd (if available)
        run: |
          if ! command -v sqlcmd &> /dev/null && [ ! -x /opt/mssql-tools18/bin/sqlcmd ] && [ ! -x /opt/mssql-tools/bin/sqlcmd ]; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg 2>/dev/null || true
            curl -fsSL https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list 2>/dev/null || true
            sudo apt-get update -qq 2>/dev/null || true
            sudo ACCEPT_EULA=Y apt-get install -y -qq mssql-tools18 unixodbc-dev 2>/dev/null || true
            if [ -d "/opt/mssql-tools18/bin" ]; then
              echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH
            fi
          fi

      - name: Parse migrations with SQL Server
        env:
          DB_HOST: localhost
          DB_PORT: 1433
          DB_USERNAME: sa
          DB_PASSWORD: 'yourStrong(!)Password123'
        run: |
          node .github/scripts/parse-migrations.mjs --self-test
          node .github/scripts/parse-migrations.mjs
