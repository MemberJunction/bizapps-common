name: Build All Packages

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'packages/**'
      # migrations/** and migrations-pg/** are here because business-time-zone-migration.test.ts
      # reads those files: a PR that renames fnBusinessToday or drops its GRANT touches no package
      # and would otherwise never run the test that pins the contract.
      - 'migrations/**'
      - 'migrations-pg/**'
      # So a change to this workflow runs it.
      - '.github/workflows/build.yml'
  pull_request:
    branches: [next]
    paths:
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'migrations/**'
      - 'migrations-pg/**'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: 'pnpm'` needs pnpm already on PATH.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Validate repository.url in packages
        run: ./.github/scripts/validate-package-repository.sh

      # Runs on every PR, not only at publish. validate-package-lock-case.sh is a release gate, so
      # a bug in the GATE would otherwise be discovered during a release — the one-level-up form of
      # the failure it exists to prevent, and exactly what happened: it could not detect a mis-cased
      # path at all. These fixtures drive the real script against throwaway repos, including the
      # mis-cased cases that fail without the fix.
      - name: CI guard script tests
        run: ./.github/scripts/__tests__/validate-package-lock-case.test.sh

      # Seconds, and needs no install: asserts every mutation anchor still matches exactly once.
      # A stale anchor reports SKIP and tests nothing; this fails the PR that made it stale. The
      # mutants themselves run in mutants.yml, because 96 full suite runs do not belong here.
      - name: Mutation anchors
        run: pnpm run test:mutants:anchors

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build:packages

      # Runs every package's test script, after the build: a test that imports a workspace
      # package by name resolves through its dist/, so without the build it fails to resolve
      # and never executes. --no-bail runs every package and still fails the job if any fails.
      - name: Unit tests
        run: pnpm -r --no-bail test
