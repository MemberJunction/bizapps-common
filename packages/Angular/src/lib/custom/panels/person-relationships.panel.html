<mj-collapsible-panel
    SectionKey="relationships"
    SectionName="Relationships"
    Icon="fa fa-handshake"
    [Form]="FormComponent"
    [FormContext]="FormContext"
    [DefaultExpanded]="true">
    @if (Record.IsSaved) {
        <div class="bizapps-view-switcher-bar">
            <div class="bizapps-view-segmented-group" role="group" aria-label="Relationship view mode">
                <button
                    type="button"
                    class="bizapps-view-segment-btn"
                    [class.active]="ViewMode === 'list'"
                    (click)="SetViewMode('list')">
                    <i class="fa-solid fa-table-list"></i>
                    <span>Table</span>
                </button>
                <button
                    type="button"
                    class="bizapps-view-segment-btn"
                    [class.active]="ViewMode === 'graph'"
                    (click)="SetViewMode('graph')">
                    <i class="fa-solid fa-circle-nodes"></i>
                    <span>Relationship Graph</span>
                </button>
            </div>
        </div>

        @if (ViewMode === 'list') {
            <bizapps-relationship-list
                [PersonID]="Record.ID"
                [Collection]="Record.OutgoingRelationships"
                [EditMode]="EditMode"
                (DataChanged)="OnWidgetDataChanged()"
                (Navigate)="FormComponent.OnFormNavigate($event)">
            </bizapps-relationship-list>
        } @else {
            <bizapps-relationship-graph
                [PersonID]="Record.ID"
                [Height]="'420px'"
                (Navigate)="FormComponent.OnFormNavigate($event)">
            </bizapps-relationship-graph>
        }
    }
</mj-collapsible-panel>
